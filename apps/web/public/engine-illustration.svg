<svg viewBox="0 0 480 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- connectors — all terminate exactly at box edges, none cross interiors -->
  <g stroke="rgba(255,255,255,0.22)" stroke-width="1.5">
    <!-- workspace -> engine (top-left port) -->
    <path d="M192 96 H199 V176 H206" />
    <!-- schema -> engine (mid-left port), already aligned, straight run -->
    <path d="M192 220 H206" />
    <!-- docs -> engine (bottom-left port) -->
    <path d="M192 344 H199 V244 H206" />
    <!-- engine -> ai query, enters from AI Query's bottom edge -->
    <path d="M320 180 H360 V128" />
  </g>

  <!-- live connector — engine -> verified answer, enters from its top edge -->
  <path d="M320 236 H360 V280" stroke="white" stroke-width="1.5" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.1s" repeatCount="indefinite" />
  </path>

  <!-- Workspace node -->
  <g>
    <rect x="24" y="56" width="168" height="80" stroke="white" stroke-opacity="0.6" />
    <text x="40" y="82" fill="white" font-size="13" font-family="ui-monospace, monospace" letter-spacing="0.5">WORKSPACE</text>
    <text x="40" y="104" fill="white" fill-opacity="0.5" font-size="11" font-family="ui-monospace, monospace">artifacts · revisions</text>
    <text x="40" y="120" fill="white" fill-opacity="0.5" font-size="11" font-family="ui-monospace, monospace">threaded comments</text>
    <line x1="192" y1="96" x2="202" y2="96" stroke="white" stroke-opacity="0.6" />
  </g>

  <!-- Schema node -->
  <g>
    <rect x="24" y="180" width="168" height="80" stroke="white" stroke-opacity="0.6" />
    <text x="40" y="206" fill="white" font-size="13" font-family="ui-monospace, monospace" letter-spacing="0.5">SCHEMA</text>
    <text x="40" y="228" fill="white" fill-opacity="0.5" font-size="11" font-family="ui-monospace, monospace">user_id · pgvector</text>
    <text x="40" y="244" fill="white" fill-opacity="0.5" font-size="11" font-family="ui-monospace, monospace">embeddings (1536)</text>
    <line x1="192" y1="220" x2="202" y2="220" stroke="white" stroke-opacity="0.6" />
  </g>

  <!-- Docs node -->
  <g>
    <rect x="24" y="304" width="168" height="80" stroke="white" stroke-opacity="0.6" />
    <text x="40" y="330" fill="white" font-size="13" font-family="ui-monospace, monospace" letter-spacing="0.5">DOCS</text>
    <text x="40" y="352" fill="white" fill-opacity="0.5" font-size="11" font-family="ui-monospace, monospace">indexed · verified</text>
    <text x="40" y="368" fill="white" fill-opacity="0.5" font-size="11" font-family="ui-monospace, monospace">manual index</text>
    <line x1="192" y1="344" x2="202" y2="344" stroke="white" stroke-opacity="0.6" />
  </g>

  <!-- Engine node — resized so it no longer overlaps Verified Answer -->
  <g>
    <rect x="206" y="146" width="114" height="114" stroke="white" stroke-width="1.5" />
    <text x="222" y="196" fill="white" font-size="14" font-weight="600" font-family="ui-monospace, monospace">ENGINE</text>
    <text x="222" y="216" fill="white" fill-opacity="0.5" font-size="10" font-family="ui-monospace, monospace">grounded</text>
    <text x="222" y="230" fill="white" fill-opacity="0.5" font-size="10" font-family="ui-monospace, monospace">traceable</text>
    <!-- left ports (inputs) -->
    <line x1="206" y1="176" x2="196" y2="176" stroke="white" stroke-opacity="0.6" />
    <line x1="206" y1="220" x2="196" y2="220" stroke="white" stroke-opacity="0.6" />
    <line x1="206" y1="244" x2="196" y2="244" stroke="white" stroke-opacity="0.6" />
    <!-- right ports (outputs) -->
    <line x1="320" y1="180" x2="330" y2="180" stroke="white" stroke-opacity="0.6" />
    <line x1="320" y1="236" x2="330" y2="236" stroke="white" stroke-opacity="0.6" />
  </g>

  <!-- AI Query card -->
  <g>
    <rect x="288" y="56" width="168" height="72" stroke="white" stroke-width="1.5" />
    <text x="304" y="82" fill="white" font-size="12" font-family="ui-monospace, monospace" letter-spacing="0.5">AI QUERY</text>
    <text x="304" y="102" fill="white" fill-opacity="0.5" font-size="10" font-family="ui-monospace, monospace">&quot;schema for payments?&quot;</text>
    <circle cx="440" cy="70" r="4" fill="white" fill-opacity="0.8" />
    <line x1="360" y1="128" x2="360" y2="138" stroke="white" stroke-opacity="0.6" />
  </g>

  <!-- Verified Answer card — moved down so it clears the Engine box entirely -->
  <g>
    <rect x="288" y="280" width="168" height="140" stroke="white" stroke-width="1.5" />
    <line x1="360" y1="270" x2="360" y2="280" stroke="white" stroke-opacity="0.6" />
    <text x="304" y="306" fill="white" font-size="12" font-family="ui-monospace, monospace" letter-spacing="0.5">VERIFIED ANSWER</text>
    <line x1="304" y1="320" x2="440" y2="320" stroke="white" stroke-opacity="0.2" />
    <text x="304" y="340" fill="white" fill-opacity="0.7" font-size="10" font-family="ui-monospace, monospace">order_id (string)</text>
    <text x="304" y="356" fill="white" fill-opacity="0.7" font-size="10" font-family="ui-monospace, monospace">amount (integer)</text>
    <text x="304" y="372" fill="white" fill-opacity="0.4" font-size="10" font-family="ui-monospace, monospace">+ 2 more fields</text>
    <line x1="304" y1="388" x2="440" y2="388" stroke="white" stroke-opacity="0.2" />
    <text x="304" y="408" fill="white" fill-opacity="0.5" font-size="9" font-family="ui-monospace, monospace">source: schema.db, payments.md</text>
  </g>

  <!-- baseline caption row -->
  <text x="24" y="480" fill="white" fill-opacity="0.35" font-size="11" font-family="ui-monospace, monospace">every answer traces back to a source.</text>
  <text x="24" y="500" fill="white" fill-opacity="0.35" font-size="11" font-family="ui-monospace, monospace">nothing grounded, nothing shipped.</text>
</svg>
