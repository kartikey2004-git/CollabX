services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: collab-editor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collab-editor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: collab-editor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible object storage for local development (asset uploads) — the API's
  # lib/object-storage.ts and config/index.ts already point at this by default
  # (S3_ENDPOINT=http://localhost:9000, minioadmin/minioadmin); this was the missing piece.
  minio:
    image: minio/minio:latest
    container_name: collab-editor-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: creates the bucket the API uploads into and makes it anonymously
  # downloadable, since object-storage.ts returns bare public URLs (never signed ones).
  # Exits 0 once done; not a long-running service.
  minio-init:
    image: minio/mc:latest
    container_name: collab-editor-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/artifact-uploads &&
      mc anonymous set download local/artifact-uploads
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
